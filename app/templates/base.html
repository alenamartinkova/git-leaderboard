<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Git Leaderboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>🏆 Git Leaderboard</h1>
                {% if orgs | length > 1 %}
                <form method="get" action="/select-org" class="org-picker">
                    <input type="hidden" name="next" value="{{ request.url.path }}">
                    <label class="org-label" for="org-select">org:</label>
                    <select id="org-select" name="org" onchange="this.form.submit()">
                        <option value="">Všetky organizácie</option>
                        {% for o in orgs %}
                        <option value="{{ o }}" {% if o == org %}selected{% endif %}>{{ o }}</option>
                        {% endfor %}
                    </select>
                    <noscript><button type="submit">OK</button></noscript>
                </form>
                {% else %}
                <p class="org">org: <code>{{ org_label }}</code></p>
                {% endif %}
            </div>
            <nav class="topnav">
                {% set path = request.url.path %}
                <a href="/" class="{% if path == '/' %}active{% endif %}">Leaderboard</a>
                <a href="/dashboard" class="{% if path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
                <a href="/people" class="{% if path.startswith('/people') %}active{% endif %}">Ľudia</a>
                <a href="/repos" class="{% if path.startswith('/repos') %}active{% endif %}">Repos</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer id="sync-footer" data-syncing="{{ '1' if syncing else '0' }}">
        {% with next_url = request.url.path %}{% include "_sync_footer.html" %}{% endwith %}
    </footer>
    <script>
        (function () {
            const footer = document.getElementById('sync-footer');
            if (!footer) return;
            let timer = null;

            async function tick() {
                try {
                    const res = await fetch('/sync/status', { headers: { 'Accept': 'text/html' } });
                    if (!res.ok) return;
                    const syncing = res.headers.get('X-Syncing') === '1';
                    const html = await res.text();
                    footer.innerHTML = html;
                    const wasSyncing = footer.dataset.syncing === '1';
                    footer.dataset.syncing = syncing ? '1' : '0';
                    if (!syncing) {
                        stop();
                        if (wasSyncing) {
                            // sync just finished — refresh data on the page
                            window.location.reload();
                        }
                    }
                } catch (_) { /* ignore */ }
            }

            function start() {
                if (timer) return;
                timer = setInterval(tick, 3000);
            }
            function stop() {
                if (timer) { clearInterval(timer); timer = null; }
            }

            if (footer.dataset.syncing === '1') start();

            // also poll lightly when not syncing so we pick up a sync started elsewhere
            const idle = setInterval(async () => {
                if (footer.dataset.syncing === '1') return;
                try {
                    const res = await fetch('/sync/status', { headers: { 'Accept': 'text/html' } });
                    if (!res.ok) return;
                    if (res.headers.get('X-Syncing') === '1') {
                        footer.innerHTML = await res.text();
                        footer.dataset.syncing = '1';
                        start();
                    }
                } catch (_) { /* ignore */ }
            }, 15000);
        })();
    </script>
</body>
</html>
